<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FFEEDD"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="360" height="360" rx="16" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Party Hat / Accessory Silhouette -->
  <g transform="translate(140, 110)">
    <!-- Party Hat -->
    <path d="M60 20 L10 140 L110 140 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="60" cy="15" r="10" fill="#EF4444"/>
    <!-- Stripes -->
    <path d="M35 80 L85 80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 110 L98 110" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Sparkles -->
    <path d="M-15 30 Q-5 30 -5 20 Q-5 30 5 30 Q-5 30 -5 40 Q-5 30 -15 30 Z" fill="#F59E0B"/>
    <path d="M125 50 Q135 50 135 40 Q135 50 145 50 Q135 50 135 60 Q135 50 125 50 Z" fill="#F59E0B"/>
    <path d="M115 110 Q122 110 122 103 Q122 110 129 110 Q122 110 122 117 Q122 110 115 110 Z" fill="#EF4444"/>
  </g>

  <!-- Accessory Label -->
  <text x="200" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="1">CELEBRATION ACCESSORY</text>
  <text x="200" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#B45309" text-anchor="middle">CakeToHome Party Collection</text>
</svg>

